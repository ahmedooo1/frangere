version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frangere
      POSTGRES_PASSWORD: frangere
      POSTGRES_DB: frangere
    ports:
      # localhost only : jamais expose publiquement, meme en prod
      - '127.0.0.1:5433:5432'
    volumes:
      - frangere_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U frangere']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frangere_pgdata:
